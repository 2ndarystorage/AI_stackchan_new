name: Core2 checks

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -p 'test_*.py'
      - run: c++ -std=c++11 server/test_device_timer.cpp -o /tmp/stackchan-timer-test
      - run: /tmp/stackchan-timer-test
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: core2-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e core2
